# 論語．學而 1.13（教學簡報 v2 格式）
# 破音字語法：[字:1]=第2讀音、[字:2]=第3讀音、[字|ㄩㄝˋ]=手動合成注音

footer: "論語 · 學而篇 | The Analects · Book One"

slides:
  - type: content
    tag: "學而 1.13 · Analects 1.13"
    speaker: { zh: "有子曰：", py: "Yǒu zǐ yuē", en: "Youzi said," }
    lines:
      - zh: "「信近於義，"
        py: "xìn jìn yú yì"
        en: "“When one’s trustworthiness is grounded in righteousness,"
      - zh: "言可復也；"
        py: "yán kě fù yě"
        en: "then one’s promises can be fulfilled;"

  - type: content
    tag: "學而 1.13 · Analects 1.13"
    lines:
      - zh: "恭近於禮，"
        py: "gōng jìn yú lǐ"
        en: "when one’s reverence is grounded in propriety,"
      - zh: "[遠:1]恥辱也；"
        py: "yuàn chǐ rǔ yě"
        en: "then one can stay far from shame and disgrace."

  - type: content
    tag: "學而 1.13 · Analects 1.13"
    lines:
      - zh: "因不失其親，"
        py: "yīn bù shī qí qīn"
        en: "Furthermore, one should not lose one’s relatives,"
      - zh: "亦可宗也。」"
        py: "yì kě zōng yě"
        en: "and one can be respected as a successor.”"

  - type: vocab
    tag: "學而 1.13 · Analects 1.13"
    words:
      - { zh: "義", py: "yì", en: "what is right" }
      - { zh: "恥辱", py: "chǐ rǔ", en: "shame, disgrace" }
      - { zh: "親", py: "qīn", en: "close, intimate" }
