    tag: "學而 1.9 · Analects 1.9"
    speaker: { zh: "[曾:1]子曰：", py: "Zēng zǐ yuē", en: "The philosopher Zeng said," }
    lines:
      - zh: "「慎終追遠，"
        py: "shèn zhōng zhuī yuǎn"
