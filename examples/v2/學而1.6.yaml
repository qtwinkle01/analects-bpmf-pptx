# 論語．學而 1.6（教學簡報 v2 格式）
# 破音字語法：[字:1]=第2讀音、[字:2]=第3讀音、[字|ㄩㄝˋ]=手動合成注音

footer: "論語 · 學而篇 | The Analects · Book One"

slides:
  - type: content
    tag: "學而 1.6 · Analects 1.6"
    speaker: { zh: "子曰：", py: "Zǐ yuē", en: "The Confucius said," }
    lines:
      - zh: "「弟子入則孝，"
        py: "dì zǐ rù zé xiào"
        en: "“A youth, when at home, should be filial,"
      - zh: "出則[弟:2]，"
        py: "chū zé tì"
        en: "and, abroad, respectful to his elders."

  - type: content
    tag: "學而 1.6 · Analects 1.6"
    lines:
      - zh: "謹而信，"
        py: "jǐn ér xìn"
        en: "He should be earnest and truthful."
      - zh: "汎愛眾，"
        py: "fàn ài zhòng"
        en: "He should overflow in love to all,"
      - zh: "而親仁。"
        py: "ér qīn rén"
        en: "and cultivate the friendship of the good."

  - type: content
    tag: "學而 1.6 · Analects 1.6"
    lines:
      - zh: "行有餘力，"
        py: "xíng yǒu yú lì"
        en: "When he has time and opportunity, after practicing of these things,"
      - zh: "則以學文。」"
        py: "zé yǐ xué wén"
        en: "he should employ them in polite studies.”"

  - type: vocab
    tag: "學而 1.6 · Analects 1.6"
    words:
      - { zh: "弟子", py: "dì zǐ", en: "a young man; disciple" }
      - { zh: "眾", py: "zhòng", en: "everyone, the multitude" }
      - { zh: "文", py: "wén", en: "culture, learning" }
