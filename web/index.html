<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論語投影片編輯器 · Analects Slide Editor</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-zh">論語投影片編輯器</span>
    <span class="brand-en">Analects Slide Editor</span>
  </div>
  <div class="controls">
    <label class="ctl">
      <span>章節</span>
      <select id="chapterSelect"></select>
    </label>
    <button id="resetBtn" class="btn btn-ghost" title="還原成預設值">重設本章</button>
    <button id="downloadBtn" class="btn btn-primary">下載 PPT</button>
  </div>
</header>

<main class="layout">
  <section class="editor" id="editor">
    <div class="loading">載入中…</div>
  </section>
  <section class="preview-pane">
    <div class="preview-head">
      <span>即時預覽</span>
      <span class="hint">下載的 PPT 會與此一致</span>
    </div>
    <div id="preview" class="preview-scroll"></div>
  </section>
</main>

<!-- 破音字讀音選單（浮動） -->
<div id="popover" class="popover hidden"></div>

<div id="toast" class="toast hidden"></div>

<script src="js/pptxgen.bundle.js"></script>
<script src="js/render.js"></script>
<script src="js/layout.js"></script>
<script src="js/preview.js"></script>
<script src="js/pptx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
