name: Deploy Analects website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'examples/v2/**'
      - 'fonts/**'
      - 'tools/bootstrap/zhuyin_font.py'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'examples/v2/**'
      - 'fonts/**'
      - 'tools/bootstrap/zhuyin_font.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 進來就取消排隊中的舊的（但不中斷進行中的部署）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. 從 examples/v2 重建資料與精簡字型、跑版面檢查、預先產生每章與整篇 PPT ──
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝相依套件
        run: pip install pyyaml fonttools brotli freetype-py numpy pillow pypinyin

      - name: 從 examples/v2 重建 data/*.json 與精簡字型
        run: |
          python web/tools/build_assets.py \
            --yaml-dir examples/v2 \
            --font fonts/BpmfZihiKaiStd-Regular.ttf \
            --out web

      - name: 版面與資料檢查（拼音對齊、破音字讀音、字型缺字）
        run: |
          python web/tools/font_widths.py --font web/assets/bpmf-subset.woff2 --out "$RUNNER_TEMP/widths.json"
          node web/tools/check_layout.js "$RUNNER_TEMP/widths.json"

      # 注音來自字型、拼音是 YAML 另外打的字；只改一邊（例如標了 [不:1] 卻沒改拼音）會在這裡擋下
      - name: 讀音檢查（每個字的注音與拼音是否一致）
        run: python web/tools/check_readings.py --yaml-dir examples/v2 --font fonts/BpmfZihiKaiStd-Regular.ttf

      # Carlito 與 Calibri 字寬相同：讓英文換行的預估跟 PowerPoint 實際顯示一致
      - name: 安裝 Playwright 與 Carlito 字型（預先產生 PPT 用）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-crosextra-carlito
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      # 用無頭瀏覽器跑網頁本身的排版程式，結果與老師在網頁上按「下載 PPT」相同
      - name: 預先產生每章與整篇 PPT
        run: |
          python -m http.server 8765 --directory web >/dev/null 2>&1 &
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node web/tools/export_all_pptx.js http://127.0.0.1:8765/ web

      - name: 確認網站檔案齊全
        run: |
          set -e
          for f in web/index.html web/edit.html web/css/styles.css \
                   web/js/i18n.js web/js/render.js web/js/layout.js web/js/preview.js web/js/data.js \
                   web/js/vocab.js web/js/yaml.js web/js/pptx.js web/js/editor.js web/js/site.js \
                   web/js/pptxgen.bundle.js web/js/vendor/js-yaml.min.js web/assets/bpmf-subset.woff2 \
                   web/data/index.json web/data/chapters.json web/data/readings.json web/data/pptx.json; do
            [ -s "$f" ] || { echo "缺少或空白：$f"; exit 1; }
          done
          ls web/pptx/*.pptx >/dev/null || { echo "沒有產生任何 PPT"; exit 1; }
          touch web/.nojekyll
          echo "網站大小：$(du -sh web | cut -f1)"

      # 檔案網址帶上 commit 編號（?v=xxxxxxx），瀏覽器才不會混用新舊檔案
      - name: 加上版本號
        run: |
          set -e
          V="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$V/g" web/index.html web/edit.html web/css/styles.css
          if grep -n "__BUILD__" web/index.html web/edit.html web/css/styles.css; then echo "版本號替換不完整"; exit 1; fi
          echo "版本號：$V"

      - name: 移除不需要上線的檔案
        run: rm -rf web/tools

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # ── 2. 部署到 GitHub Pages（PR 只驗證不部署）──
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
